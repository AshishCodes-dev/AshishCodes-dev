<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12" />
      <stop offset="50%" stop-color="#0e131b" />
      <stop offset="100%" stop-color="#080a0e" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes lineType {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; }
    }

    .window {
      filter: url(#shadow);
    }
    .term-border {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .code-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, 'Courier New', monospace;
      font-size: 14px;
      line-height: 22px;
    }
    .cursor {
      animation: blink 1s infinite;
      fill: #58a6ff;
    }
    
    /* Syntax Highlighting */
    .c-keyword { fill: #ff7b72; font-weight: 600; }
    .c-def     { fill: #79c0ff; font-weight: 600; }
    .c-prop    { fill: #d2a8ff; }
    .c-string  { fill: #a5d6ff; }
    .c-comment { fill: #8b949e; font-style: italic; }
    .c-number  { fill: #ffa657; }
    .c-punct   { fill: #e6edf3; }
    .c-accent  { fill: #7ee787; font-weight: 600; }
    .c-dim     { fill: #6e7681; }

    /* Staggered entrance animations */
    .l-1 { animation: fadeIn 0.4s ease-out 0.2s both; }
    .l-2 { animation: fadeIn 0.4s ease-out 0.5s both; }
    .l-3 { animation: fadeIn 0.4s ease-out 0.8s both; }
    .l-4 { animation: fadeIn 0.4s ease-out 1.1s both; }
    .l-5 { animation: fadeIn 0.4s ease-out 1.4s both; }
    .l-6 { animation: fadeIn 0.4s ease-out 1.7s both; }
    .l-7 { animation: fadeIn 0.4s ease-out 2.0s both; }
    .l-8 { animation: fadeIn 0.4s ease-out 2.3s both; }
    .l-9 { animation: fadeIn 0.4s ease-out 2.6s both; }
    .l-10 { animation: fadeIn 0.4s ease-out 2.9s both; }
    .l-11 { animation: fadeIn 0.4s ease-out 3.2s both; }
    .l-12 { animation: fadeIn 0.4s ease-out 3.5s both; }
    .l-13 { animation: fadeIn 0.4s ease-out 3.8s both; }
  </style>

  <!-- Terminal Window Background -->
  <g class="window" transform="translate(20, 15)">
    <!-- Outer Glow & Border -->
    <rect x="0" y="0" width="810" height="370" rx="14" fill="url(#bgGradient)" stroke="url(#borderGlow)" stroke-width="1.5" class="term-border" />

    <!-- Terminal Header Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 796 0 Q 810 0 810 14 L 810 38 L 0 38 Z" fill="url(#headerGrad)" />
    <line x1="0" y1="38" x2="810" y2="38" stroke="#30363d" stroke-width="1" />

    <!-- macOS Control Buttons -->
    <circle cx="22" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="42" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="62" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Header Title & Breadcrumb -->
    <text x="405" y="24" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="12px" font-weight="500">
      ⚡ ashish@deepmind-arch : ~/systems/core.ts
    </text>

    <!-- Host Pill Tag (Right Side) -->
    <rect x="690" y="10" width="105" height="18" rx="9" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="0.8" />
    <text x="742" y="23" text-anchor="middle" fill="#58a6ff" font-family="'JetBrains Mono', monospace" font-size="10px" font-weight="600">
      ● PRODUCTION
    </text>

    <!-- Code Content Area -->
    <g class="code-text" transform="translate(30, 70)">
      
      <!-- Line 1: Bash Execution Command -->
      <g class="l-1">
        <text x="0" y="0" class="c-dim">$</text>
        <text x="16" y="0" class="c-accent">curl</text>
        <text x="56" y="0" class="c-string">-sL https://ashish.dev/whoami.json</text>
        <text x="350" y="0" class="c-dim">|</text>
        <text x="365" y="0" class="c-prop">jq</text>
        <text x="388" y="0" class="c-string">'.engineer'</text>
      </g>

      <!-- Line 2: Interface / Object Open -->
      <g class="l-2">
        <text x="0" y="26" class="c-keyword">const</text>
        <text x="48" y="26" class="c-def">engineer</text>
        <text x="120" y="26" class="c-punct">: </text>
        <text x="135" y="26" class="c-prop">SystemsArchitect</text>
        <text x="275" y="26" class="c-punct">= {</text>
      </g>

      <!-- Line 3: Name -->
      <g class="l-3">
        <text x="24" y="50" class="c-prop">name</text>
        <text x="58" y="50" class="c-punct">: </text>
        <text x="75" y="50" class="c-string">"Ashish Pratap Singh"</text>
        <text x="250" y="50" class="c-punct">,</text>
      </g>

      <!-- Line 4: Role -->
      <g class="l-4">
        <text x="24" y="74" class="c-prop">role</text>
        <text x="58" y="74" class="c-punct">: </text>
        <text x="75" y="74" class="c-string">"Full-Stack AI &amp; Systems Engineer"</text>
        <text x="375" y="74" class="c-punct">,</text>
      </g>

      <!-- Line 5: Location -->
      <g class="l-5">
        <text x="24" y="98" class="c-prop">location</text>
        <text x="92" y="98" class="c-punct">: </text>
        <text x="110" y="98" class="c-string">"Jaipur, Rajasthan, India 🇮🇳"</text>
        <text x="355" y="98" class="c-punct">,</text>
      </g>

      <!-- Line 6: Core Stack -->
      <g class="l-6">
        <text x="24" y="122" class="c-prop">coreStack</text>
        <text x="100" y="122" class="c-punct">: [</text>
        <text x="120" y="122" class="c-string">"TypeScript"</text>
        <text x="225" y="122" class="c-punct">, </text>
        <text x="240" y="122" class="c-string">"React 19"</text>
        <text x="325" y="122" class="c-punct">, </text>
        <text x="340" y="122" class="c-string">"Node.js"</text>
        <text x="415" y="122" class="c-punct">, </text>
        <text x="430" y="122" class="c-string">"OpenRouter AI"</text>
        <text x="560" y="122" class="c-punct">],</text>
      </g>

      <!-- Line 7: Specialties -->
      <g class="l-7">
        <text x="24" y="146" class="c-prop">specialization</text>
        <text x="142" y="146" class="c-punct">: {</text>
      </g>

      <!-- Line 8: AI Latency -->
      <g class="l-8">
        <text x="48" y="170" class="c-prop">aiVoiceLatency</text>
        <text x="175" y="170" class="c-punct">: </text>
        <text x="195" y="170" class="c-accent">"&lt; 250ms"</text>
        <text x="270" y="170" class="c-comment"> // Web Audio + OpenRouter streaming</text>
      </g>

      <!-- Line 9: Routing Engine -->
      <g class="l-9">
        <text x="48" y="194" class="c-prop">routingEngine</text>
        <text x="165" y="194" class="c-punct">: </text>
        <text x="185" y="194" class="c-accent">"&lt; 150ms"</text>
        <text x="260" y="194" class="c-comment"> // Turn-by-turn Leaflet + OSRM</text>
      </g>

      <!-- Line 10: Uptime SLA -->
      <g class="l-10">
        <text x="48" y="218" class="c-prop">productionSLA</text>
        <text x="165" y="218" class="c-punct">: </text>
        <text x="185" y="218" class="c-number">99.8</text>
        <text x="220" y="218" class="c-punct">, </text>
        <text x="240" y="218" class="c-comment"> // 3 applications live on Vercel</text>
      </g>

      <!-- Line 11: End Specialization -->
      <g class="l-11">
        <text x="24" y="242" class="c-punct">},</text>
      </g>

      <!-- Line 12: Mission Statement -->
      <g class="l-12">
        <text x="24" y="266" class="c-prop">motto</text>
        <text x="68" y="266" class="c-punct">: </text>
        <text x="85" y="266" class="c-string">"Ship fast. Measure latency. Never compromise on security."</text>
      </g>

      <!-- Line 13: Closing + Blinking Cursor -->
      <g class="l-13">
        <text x="0" y="290" class="c-punct">};</text>
        <rect x="25" y="276" width="9" height="17" rx="2" class="cursor" />
      </g>

    </g>
  </g>
</svg>
